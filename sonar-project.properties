sonar.projectKey=MunneLautaro_E-commerce-Muebleria-Hermanos-Jota
sonar.organization=munnelautaro
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.exclusions=backend/tests/**,client/src/**/*.test.js,client/src/**/*.test.jsx,client/src/test/**,**/coverage/**,**/dist/**

sonar.tests=backend/tests,client/src
sonar.test.inclusions=backend/tests/**,client/src/**/*.test.js,client/src/**/*.test.jsx,client/src/test/**

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,client/coverage/lcov.info
sonar.coverage.exclusions=**/*.config.js
